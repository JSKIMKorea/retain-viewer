name: Daily Retain Update_v2
on:
  schedule:
    # 매일 한국시간 오전 8시 5분 (UTC 전날 23시 5분)
    - cron: '5 23 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Node.js 20 deprecated 이후 Node.js 24로 자동 전환 대응
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          # Microsoft ODBC repo 추가
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add - 2>/dev/null || true
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          # apt-get update: 미러 실패 시에도 계속 진행
          sudo apt-get update --fix-missing || sudo apt-get update -o Acquire::Retries=3 || true
          # msodbcsql17 설치: 네트워크 불안정 대비 재시도 + fix-missing
          for i in 1 2 3; do
            sudo ACCEPT_EULA=Y apt-get install -y --fix-missing msodbcsql17 && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          pip install pyodbc pandas requests python-dotenv bcrypt openpyxl
      - name: Run retain_all.py
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
          GITHUB_ACTIONS: true
          GH_LOG_TOKEN: ${{ secrets.GH_LOG_TOKEN }}
          GH_LOG_REPO: ${{ secrets.GH_LOG_REPO }}
        run: python retain_all.py
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git reset --soft origin/main
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
