name: Daily DART Update
on:
  schedule:
    # 3일마다 한국시간 오후 7시 (UTC 10시)
    - cron: '0 10 */3 * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          # Microsoft ODBC repo 추가
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add - 2>/dev/null || true
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          # apt-get update: 미러 실패 시에도 계속 진행
          sudo apt-get update --fix-missing || sudo apt-get update -o Acquire::Retries=3 || true
          # msodbcsql17 설치: 네트워크 불안정 대비 재시도 + fix-missing
          for i in 1 2 3; do
            sudo ACCEPT_EULA=Y apt-get install -y --fix-missing msodbcsql17 && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          pip install pyodbc pandas requests python-dotenv
      - name: Run dart_update.py
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GITHUB_ACTIONS: true
        run: python dart_update.py
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git reset --soft origin/main
          git add dart_cache/
          git diff --staged --quiet || git commit -m "DART update $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
